<button
  type="button"
  class="hover:cursor-pointer text-white bg-{{
    color()
  }} box-border border border-transparent hover:bg-{{
    color()
  }}-400 focus:ring-4 focus:ring-{{
    color()
  }}-600 shadow-xs rounded-base text-sm p-2.5 focus:outline-none"
>
  <ng-icon [name]="name()" [size]="size()"></ng-icon>
</button>
