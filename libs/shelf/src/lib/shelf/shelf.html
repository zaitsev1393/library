<div class="flex justify-between items-center">
  <div class="flex justify-start items-center gap-2">
    <lib-view-switcher />
    <label
      for="search"
      class="block mb-2.5 text-sm font-medium text-heading sr-only"
      >Search</label
    >
    <div class="relative">
      <div
        class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
      >
        <svg
          class="w-4 h-4 text-body"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
          />
        </svg>
      </div>
      <input
        type="search"
        id="search"
        class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
        placeholder="Search"
        (input)="shelfStore.search.set($event.target.value || '')"
      />
    </div>
  </div>
  <div class="flex gap-2">
    <lib-button (click)="addBook()">Add book</lib-button>
    <lib-button>
      <label for="fileUpload" class="hover:cursor-pointer">Import XML</label>
      <input
        id="fileUpload"
        type="file"
        class="hidden"
        [accept]="ACCEPTED_FORMATS"
        (change)="onFileSelected($event)"
      />
    </lib-button>
    <lib-button (click)="downloadLibrary()">
      <ng-icon name="heroArrowDownTray" />
    </lib-button>
  </div>
</div>
<div class="mt-4 mb-16">
  <router-outlet />
</div>
