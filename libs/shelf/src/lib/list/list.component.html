<div>
  <div
    class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"
  >
    <table class="w-full text-sm text-left rtl:text-right text-body">
      <thead
        class="text-sm text-body bg-neutral-secondary-medium border-b border-default-medium"
      >
        <tr>
          <th scope="col" class="px-6 py-3 font-medium">
            <div class="flex items-center">
              Title
              <button class="hover:cursor-pointer" (click)="sortByTitle()">
                <svg
                  class="w-4 h-4 ms-1"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m8 15 4 4 4-4m0-6-4-4-4 4"
                  />
                </svg>
              </button>
            </div>
          </th>
          <th scope="col" class="px-6 py-3 font-medium">
            <div class="flex items-center">
              Author
              <button class="hover:cursor-pointer" (click)="sortByAuthor()">
                <svg
                  class="w-4 h-4 ms-1"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m8 15 4 4 4-4m0-6-4-4-4 4"
                  />
                </svg>
              </button>
            </div>
          </th>
          <th scope="col" class="px-6 py-3 font-medium">
            <div class="flex items-center">
              Pages
              <button class="hover:cursor-pointer" (click)="sortByPages()">
                <svg
                  class="w-4 h-4 ms-1"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m8 15 4 4 4-4m0-6-4-4-4 4"
                  />
                </svg>
              </button>
            </div>
          </th>
          <th scope="col" class="px-6 py-3 font-medium">
            <span class="sr-only">Edit</span>
          </th>
        </tr>
      </thead>
      <tbody>
        @for (book of filteredBooks(); track book.title) {
          <tr class="bg-neutral-primary-soft border-b border-default">
            <th
              scope="row"
              class="px-6 py-4 font-medium text-heading whitespace-nowrap"
            >
              {{ book.title }}
            </th>
            <td class="px-6 py-4">{{ book.author }}</td>
            <td class="px-6 py-4">{{ book.pages }}</td>
            <td class="px-6 py-4 text-right">
              <button
                [cdkMenuTriggerFor]="menu"
                class="font-medium text-fg-brand hover:underline hover:cursor-pointer"
              >
                <ng-icon name="heroEllipsisHorizontal" size="24" />
              </button>
              <ng-template #menu>
                <div
                  id="dropdown"
                  cdkMenu
                  class="z-10 bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
                >
                  <ul class="p-2 text-sm text-body font-medium">
                    <li>
                      <div
                        role="button"
                        tabindex="0"
                        class="hover:cursor-pointer inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                        (click)="editBook(book)"
                        (keydown.enter)="editBook(book)"
                      >
                        Edit
                      </div>
                    </li>
                    <li>
                      <div
                        role="button"
                        tabindex="0"
                        class="hover:cursor-pointer inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded text-red-600"
                        (click)="deleteBook(book)"
                        (keydown.enter)="deleteBook(book)"
                      >
                        Delete
                      </div>
                    </li>
                  </ul>
                </div>
              </ng-template>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
