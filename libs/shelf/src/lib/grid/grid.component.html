<div class="grid-container">
  @for (book of books(); track book.title) {
    <lib-book-card
      [book]="book"
      (editBook)="editBook($event)"
      (deleteBook)="deleteBook($event)"
    ></lib-book-card>
  }
</div>

@if (books().length === 0) {
  <div class="w-full mt-16 text-center flex justify-center">
    <p>No books found, try clearing your search.</p>
  </div>
}
