<div class="book-card" [style.background]="book()?.id | randomColor">
  <div class="book-card-body">
    <div class="actions">
      <ng-icon name="heroPencilSquare" (click)="editBook.emit(book())" />
      <ng-icon name="heroTrash" (click)="deleteBook.emit(book())" />
    </div>
    <div
      class="flex-4 flex justify-center items-center p-4 text-center text-title-light font-medium"
    >
      <h3>{{ book()?.title }}</h3>
    </div>
    <div
      class="flex-1 flex justify-center bg-paper-dim items-center italic text-title-ink"
    >
      <p>{{ book()?.author }}</p>
    </div>
    <div
      class="flex-1 flex justify-center items-center text-sm text-title-light font-medium"
    >
      <p>{{ book()?.pages }}</p>
    </div>
  </div>
</div>
